<!DOCTYPE html>
<html>
<head>
  <title>AK's Cyber Home</title>
  <link rel="stylesheet" href="style.css">
</head>
  
<body>
<canvas id="matrix"></canvas>
<header>
  <h1>AK CYBER HOME</h1>
  <p>Cybersecurity | Protect | Detect | Respond</p>
</header>

<section>
  <h2>Welcome</h2>
  <p>This is Anush cybersecurity website 🚀</p>
  <button class="cta-btn" onclick="scrollToContact()">Get Started</button>
</section>

<section>
  <h2>Services</h2>
  <ul>
    <li>SOC Monitoring</li>
    <li>Penetration Testing</li>
    <li>Cloud Security</li>
  </ul>
</section>
  
  <section>
  <h2>🛡️ Live Threat Dashboard</h2>
  <div class="card">
    <p>Threat Level: <span id="threat">LOW</span></p>
    <p>Alerts Detected: <span id="alerts">3</span></p>
    <button onclick="simulateThreat()">Simulate Attack</button>
  </div>
</section>

<section id="contact">
  <h2>📬 Contact AK Cyber Home</h2>

  <form action="https://formspree.io/f/yourid" method="POST">

    <input type="text" name="name" placeholder="Your Name" required>

    <input type="email" name="email" placeholder="Your Email" required>

    <input type="tel" name="contact" placeholder="Contact Number" required>

    <input type="text" name="company" placeholder="Company Name">

    <select name="purpose" required>
      <option value="">Select Purpose</option>
      <option value="job">Job Opportunity</option>
      <option value="freelance">Freelance Work</option>
      <option value="security">Security Consultation</option>
      <option value="other">Other</option>
    </select>

    <textarea name="message" placeholder="Your Message"></textarea>

    <button type="submit">🚀 Submit</button>

  </form>
</section>

<script src="script.js"></script>
<button onclick="openChat()" class="chat-btn">💬</button>

<div id="chatbox" style="display:none;">
  <p>👋 Hi, I’m AK Cyber Assistant</p>
  <input type="text" id="userInput" placeholder="Ask something...">
  <button onclick="reply()">Send</button>
  <p id="botReply"></p>
</div>
</body>
</html>
